name: Keep Supabase awake
# Free Supabase projects pause after 7 days without activity. One request a day is enough.
on:
  schedule:
    - cron: "17 2 * * *" # 10:17 Singapore time
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 30 "${{ vars.SITE_URL || 'https://mise-three-silk.vercel.app' }}/api/health"
