name: E2E
# Runs the full user journey against a deployed URL. Set repository secrets
# E2E_EMAIL, E2E_PASSWORD (a confirmed test account) and, for protected previews, VERCEL_BYPASS.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed URL to test
        required: true
        default: https://mise-three-silk.vercel.app
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results }
